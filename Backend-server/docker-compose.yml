x-core-environment: &core-environment
  NODE_ENV: production
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Backend-server/.env}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  TOKEN_VALIDATION: ${TOKEN_VALIDATION:-on}
  BRANCH_SCOPE: ${BRANCH_SCOPE:-}
  INTERNAL_NOTIFY_KEY: ${INTERNAL_NOTIFY_KEY:-}
  AUTH_SERVICE_URL: http://auth-service:5001
  STUDENT_SERVICE_URL: http://student-service:5002
  STAFF_SERVICE_URL: http://staff-service:5003
  ACADEMIC_SERVICE_URL: http://academic-service:5004
  FEE_SERVICE_URL: http://fee-service:5005
  COMMUNICATION_SERVICE_URL: http://communication-service:5006
  LIBRARY_SERVICE_URL: http://library-service:5007
  FACILITY_SERVICE_URL: http://facility-service:5008
  ACCOUNTING_SERVICE_URL: http://accounting-service:5009

x-imagekit-environment: &imagekit-environment
  IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
  IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
  IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    init: true
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in Backend-server/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in Backend-server/.env}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in Backend-server/.env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in Backend-server/.env}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok"
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 30s
    networks:
      - erp-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: "5000"
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in Backend-server/.env}
      INTERNAL_NOTIFY_KEY: ${INTERNAL_NOTIFY_KEY:-}
      GATEWAY_KEYS_ENC_KEY: ${GATEWAY_KEYS_ENC_KEY:-}
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-300000}
      AUTH_SERVICE_URL: http://auth-service:5001
      STUDENT_SERVICE_URL: http://student-service:5002
      STAFF_SERVICE_URL: http://staff-service:5003
      ACADEMIC_SERVICE_URL: http://academic-service:5004
      FEE_SERVICE_URL: http://fee-service:5005
      COMMUNICATION_SERVICE_URL: http://communication-service:5006
      LIBRARY_SERVICE_URL: http://library-service:5007
      FACILITY_SERVICE_URL: http://facility-service:5008
      ACCOUNTING_SERVICE_URL: http://accounting-service:5009
    depends_on:
      auth-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      staff-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      fee-service:
        condition: service_healthy
      communication-service:
        condition: service_healthy
      library-service:
        condition: service_healthy
      facility-service:
        condition: service_healthy
      accounting-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:5000/health',
          r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - erp-network

