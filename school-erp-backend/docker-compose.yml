version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: erp-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - erp-network

  api-gateway:
    build: ./api-gateway
    container_name: erp-api-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - student-service
      - staff-service
      - academic-service
      - fee-service
      - communication-service
      - library-service
      - facility-service
    networks:
      - erp-network

  auth-service:
    build: ./services/auth-service
    container_name: erp-auth-service
    restart: unless-stopped
    env_file: .env
    environment:
      - AUTH_MONGODB_URI=mongodb://mongo:27017/erp_auth
    depends_on:
      - mongo
    networks:
      - erp-network

  student-service:
    build: ./services/student-service
    container_name: erp-student-service
    restart: unless-stopped
    env_file: .env
    environment:
      - STUDENT_MONGODB_URI=mongodb://mongo:27017/erp_student
    depends_on:
      - mongo
    networks:
      - erp-network

  staff-service:
    build: ./services/staff-service
    container_name: erp-staff-service
    restart: unless-stopped
    env_file: .env
    environment:
      - STAFF_MONGODB_URI=mongodb://mongo:27017/erp_staff
    depends_on:
      - mongo
    networks:
      - erp-network

  academic-service:
    build: ./services/academic-service
    container_name: erp-academic-service
    restart: unless-stopped
    env_file: .env
    environment:
      - ACADEMIC_MONGODB_URI=mongodb://mongo:27017/erp_academic
    depends_on:
      - mongo
    networks:
      - erp-network

  fee-service:
    build: ./services/fee-service
    container_name: erp-fee-service
    restart: unless-stopped
    env_file: .env
    environment:
      - FEE_MONGODB_URI=mongodb://mongo:27017/erp_fee
    depends_on:
      - mongo
    networks:
      - erp-network

  communication-service:
    build: ./services/communication-service
    container_name: erp-communication-service
    restart: unless-stopped
    env_file: .env
    environment:
      - COMMUNICATION_MONGODB_URI=mongodb://mongo:27017/erp_communication
    depends_on:
      - mongo
    networks:
      - erp-network

  library-service:
    build: ./services/library-service
    container_name: erp-library-service
    restart: unless-stopped
    env_file: .env
    environment:
      - LIBRARY_MONGODB_URI=mongodb://mongo:27017/erp_library
    depends_on:
      - mongo
    networks:
      - erp-network

  facility-service:
    build: ./services/facility-service
    container_name: erp-facility-service
    restart: unless-stopped
    env_file: .env
    environment:
      - FACILITY_MONGODB_URI=mongodb://mongo:27017/erp_facility
    depends_on:
      - mongo
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  mongo_data:
